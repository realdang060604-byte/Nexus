services:
  - type: web
    name: nexus-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_USER_IDS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: NEXUS_API_KEY
        generateValue: true
      - key: NEXUS_TIME_ZONE
        value: Asia/Ho_Chi_Minh
      - key: GOOGLE_CALENDAR_ID
        value: primary
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: 60
      - key: TASK_REMINDER_MINUTES_BEFORE
        value: 15
      - key: TASK_REMINDER_INTERVAL_SECONDS
        value: 60
      - key: TASK_REMINDER_LOOKBACK_MINUTES
        value: 1440
